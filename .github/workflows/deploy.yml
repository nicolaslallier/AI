# Construit l'image, la publie sur GHCR, puis redéploie la pile « portail » dans
# Portainer depuis le runner auto-hébergé (le Portainer de l'Infra est sur le LAN).
#
# AUCUN workflow de ce dépôt ne doit avoir de déclencheur pull_request,
# pull_request_target, issue_comment ou workflow_run pouvant atteindre le label
# self-hosted `ai` : une PR de fork peut modifier ci.yml elle-même. Le dépôt est PUBLIC,
# donc il FAUT exiger l'approbation pour tous les collaborateurs externes (Settings >
# Actions > General > Fork pull request workflows from outside collaborators), et le
# runner `ai` DOIT être éphémère (conteneur neuf par job, aucun volume de travail
# persistant).
name: Build and push image

on:
  push:
    branches: [main]
    # Ce qui ne peut changer aucun conteneur ne mérite pas un redéploiement.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Un déploiement à la fois, jamais annulé en vol : Portainer resterait à mi-redéploiement.
concurrency:
  group: deploy-portail
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-portail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # ponytail: amd64 seul (hôte de déploiement) ; ajouter arm64 comme DarkAngel si la pile doit tourner sur le Mac mini.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Pas de déploiement d'une autre branche lancée par workflow_dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ai]
    timeout-minutes: 15
    # L'environnement `production` (limité à main) porte PORTAINER_API_KEY et BAO_TOKEN.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Redéployer par Portainer
        shell: bash
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL || 'https://portainer.infra.famillelallier.net' }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          VAULT_URL: ${{ vars.VAULT_URL || 'https://vault.infra.famillelallier.net' }}
          # CA de l'Infra montée dans le runner (vérifie Portainer et OpenBao).
          PORTAINER_CA_CERT: ${{ vars.INFRA_CA_CERT_PATH || '/etc/ai/infra-ca.crt' }}
          VAULT_CA_CERT: ${{ vars.INFRA_CA_CERT_PATH || '/etc/ai/infra-ca.crt' }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          set -euo pipefail
          for v in PORTAINER_API_KEY BAO_TOKEN PORTAINER_ENDPOINT_ID; do
            [ -n "${!v}" ] || { echo "::error::$v absent (secret ou variable du dépôt)"; exit 1; }
          done
          umask 077
          export PORTAIL_STACK_ENV="$RUNNER_TEMP/portail.env"
          trap 'rm -f "$PORTAIL_STACK_ENV"' EXIT
          # Chaque script ne reçoit que le secret dont il a besoin.
          PORTAINER_API_KEY= scripts/vault-render-env.sh
          # Le tag que le job image vient de pousser (metadata-action : sha-<7 car.>).
          printf 'IMAGE_TAG=sha-%s\n' "${GITHUB_SHA_FULL::7}" >> "$PORTAIL_STACK_ENV"
          BAO_TOKEN= scripts/portainer-stack.sh up
