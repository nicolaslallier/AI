[project]
name = "orchestrateur"
version = "0.1.0"
description = "Agent orchestrateur : découpe une demande de développement et la fait réaliser par des sous-agents (Claude Agent SDK)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.182",
    "httpx>=0.28.1",
]

[project.scripts]
orchestrateur = "orchestrateur.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrateur"]
