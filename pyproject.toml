[project]
name = "mllab"
version = "0.1.0"
description = "ML & LLM utilities: data processing, model training, and LLM inference"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Unlicensed" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "openai>=1.30,<2",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pandas-stubs>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mllab"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# The `images/` tree is the Colima/Docker dev-env (mirrored scripts, not the
# importable `mllab` package) and is maintained by hand — keep it out of ruff.
extend-exclude = ["images"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["mllab"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# `tests/` and the hand-maintained `images/` mirror scripts are intentionally
# kept out of the strict typing pass; the importable package lives in `src/`.
exclude = ["^tests/", "^images/"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
