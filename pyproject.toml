[project]
name = "mcp-fichiers"
version = "0.1.0"
description = "Serveur MCP implémentant l'extension io.modelcontextprotocol/files sur une copie d'un coffre Obsidian"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp==2.3.0",
    "pypdf>=7.1.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
