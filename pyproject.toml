[project]
name = "ai-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.40.0",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.32.0",
    "pyyaml>=6",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
