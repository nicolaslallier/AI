[package]
name = "lanceur"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bollard = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
