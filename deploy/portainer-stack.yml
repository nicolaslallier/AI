# Socle commun des agents : un conteneur par agent, une seule image, aucun accès hors portail.
x-agent: &agent
  image: ghcr.io/nicolaslallier/ai-agents:${IMAGE_TAG:-latest}@${AGENTS_DIGEST:?}
  networks: [portail-agents]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 64m
  pids_limit: 64
  cpus: "0.5"
  user: "65532:65532"
  restart: unless-stopped

services:
  portail:
    image: ghcr.io/nicolaslallier/ai-portail:${IMAGE_TAG:-latest}
    environment:
      PORTAIL_VERSION: ${IMAGE_TAG:-latest}
      PORTAIL_DEPLOYE_LE: ${DEPLOYE_LE:-0}
      PORTAIL_DATABASE_URL: postgresql+psycopg://portail:${PORTAIL_DB_PASSWORD:?}@postgres:5432/portail
      PORTAIL_LITELLM_URL: http://litellm:4000
      PORTAIL_LITELLM_CLE: ${PORTAIL_LITELLM_CLE:?}
      PORTAIL_LITELLM_CLE_AGENTS: ${PORTAIL_LITELLM_CLE_AGENTS:-}
      PORTAIL_JETON_SERVICE: ${PORTAIL_JETON_SERVICE:-}
      PORTAIL_EXIGER_UTILISATEUR: "true"
      PORTAIL_DONNEES_DIR: /donnees
      PORTAIL_GITHUB_JETON: ${PORTAIL_GITHUB_JETON:-}
      PORTAIL_LANCEUR_URL: http://lanceur:8080
      PORTAIL_LANCEUR_SECRET: ${PORTAIL_LANCEUR_SECRET:-}
      PORTAIL_GITHUB_APP_ID: ${PORTAIL_GITHUB_APP_ID:-}
      PORTAIL_GITHUB_APP_CLE: ${PORTAIL_GITHUB_APP_CLE:-}
      PORTAIL_GITHUB_PROPRIETAIRE: nicolaslallier
      PORTAIL_NTFY_URL: http://ntfy
      PORTAIL_NTFY_SUJET: portail
      PORTAIL_URL_PUBLIQUE: https://portail.infra.famillelallier.net
      PORTAIL_NTFY_JETON: ${PORTAIL_NTFY_JETON:-}
      PORTAIL_LLM_DELAI_S: ${PORTAIL_LLM_DELAI_S:-440}
      PORTAIL_RESEAU_AGENTS: 10.250.250.0/24
      PORTAIL_S3_URL: http://s3:8333
      PORTAIL_S3_BUCKET: obsidian
      PORTAIL_S3_ACCESS_KEY: portail
      PORTAIL_S3_SECRET_KEY: ${PORTAIL_S3_SECRET_KEY:-}
      PORTAIL_COFFRE_PREFIXE: ${PORTAIL_COFFRE_PREFIXE:-}
      PORTAIL_AGENT_SECRET_SPEC: ${PORTAIL_AGENT_SECRET_SPEC:?}
      PORTAIL_AGENT_SECRET_ORCHESTRATEUR: ${PORTAIL_AGENT_SECRET_ORCHESTRATEUR:?}
      PORTAIL_AGENT_SECRET_PLAN: ${PORTAIL_AGENT_SECRET_PLAN:?}
      PORTAIL_AGENT_SECRET_TACHES: ${PORTAIL_AGENT_SECRET_TACHES:?}
      PORTAIL_AGENT_SECRET_TESTS: ${PORTAIL_AGENT_SECRET_TESTS:?}
      PORTAIL_AGENT_SECRET_CODE: ${PORTAIL_AGENT_SECRET_CODE:?}
      PORTAIL_AGENT_SECRET_REVUE: ${PORTAIL_AGENT_SECRET_REVUE:?}
      PORTAIL_AGENT_SECRET_ARCHITECTE: ${PORTAIL_AGENT_SECRET_ARCHITECTE:?}
      PORTAIL_AGENT_SECRET_CHALLENGER: ${PORTAIL_AGENT_SECRET_CHALLENGER:?}
      PORTAIL_AGENT_SECRET_SECURITE: ${PORTAIL_AGENT_SECRET_SECURITE:?}
      PORTAIL_AGENT_SECRET_DOC: ${PORTAIL_AGENT_SECRET_DOC:?}
      PORTAIL_AGENT_SECRET_DOCUMENTALISTE: ${PORTAIL_AGENT_SECRET_DOCUMENTALISTE:?}
      PORTAIL_AGENT_SECRET_PM: ${PORTAIL_AGENT_SECRET_PM:?}
      PORTAIL_AGENT_SECRET_TRI: ${PORTAIL_AGENT_SECRET_TRI:?}
      PORTAIL_AGENT_SECRET_ARCHI_ENTREPRISE: ${PORTAIL_AGENT_SECRET_ARCHI_ENTREPRISE:?}
      PORTAIL_AGENT_SECRET_ARCHI_AFFAIRES: ${PORTAIL_AGENT_SECRET_ARCHI_AFFAIRES:?}
      PORTAIL_AGENT_SECRET_ARCHI_DONNEES: ${PORTAIL_AGENT_SECRET_ARCHI_DONNEES:?}
      PORTAIL_AGENT_SECRET_ARCHI_APPLICATIF: ${PORTAIL_AGENT_SECRET_ARCHI_APPLICATIF:?}
      PORTAIL_AGENT_SECRET_ARCHI_TECHNO: ${PORTAIL_AGENT_SECRET_ARCHI_TECHNO:?}
      PORTAIL_AGENT_SECRET_ARCHI_SECURITE: ${PORTAIL_AGENT_SECRET_ARCHI_SECURITE:?}
      PORTAIL_AGENT_SECRET_ARCHI_SOLUTION: ${PORTAIL_AGENT_SECRET_ARCHI_SOLUTION:?}
      PORTAIL_AGENT_SECRET_ARCHI_ENTREPRISE_SYNTHESE: ${PORTAIL_AGENT_SECRET_ARCHI_ENTREPRISE_SYNTHESE:?}
    volumes:
      - portail-donnees-2:/donnees
      - portail-espaces:/espaces
    networks: [infra-net, portail-lanceur, portail-agents]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/sante', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 512m
    restart: unless-stopped

  # Seul service qui touche au socket Docker ; aucun port, joignable du seul portail.
  lanceur:
    image: ghcr.io/nicolaslallier/ai-lanceur:${IMAGE_TAG:-latest}
    environment:
      LANCEUR_SECRET: ${PORTAIL_LANCEUR_SECRET:?}
      LANCEUR_VOLUME: portail-espaces
      LANCEUR_RESEAU: run-net
      # Le lanceur démarre la référence épinglée de cette liste ; les demandes nomment nom:tag.
      LANCEUR_IMAGES: ghcr.io/nicolaslallier/ai-execution:latest@${EXECUTION_DIGEST:?}
      # TODO digest : minio/minio n'a pas pu être résolu (Docker Hub refuse l'accès anonyme) ;
      # remplacer par minio/minio:<tag RELEASE daté>@sha256:… (voir README).
      LANCEUR_IMAGES_SERVICES: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f,postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663,minio/minio:latest
      LANCEUR_PROXY: http://run-egress:3128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [portail-lanceur]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 128m
    restart: unless-stopped

  # Un service par agent de agents.yaml, tous sur portail-agents : le portail est leur seul voisin.
  agent-spec:
    <<: *agent
    entrypoint: [spec]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_SPEC:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-orchestrateur:
    <<: *agent
    entrypoint: [orchestrateur]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ORCHESTRATEUR:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-plan:
    <<: *agent
    entrypoint: [plan]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_PLAN:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-taches:
    <<: *agent
    entrypoint: [taches]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_TACHES:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-tests:
    <<: *agent
    entrypoint: [tests]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_TESTS:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-code:
    <<: *agent
    entrypoint: [code]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_CODE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-revue:
    <<: *agent
    entrypoint: [revue]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_REVUE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-architecte:
    <<: *agent
    entrypoint: [architecte]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHITECTE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-challenger:
    <<: *agent
    entrypoint: [challenger]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_CHALLENGER:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-securite:
    <<: *agent
    entrypoint: [securite]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_SECURITE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-doc:
    <<: *agent
    entrypoint: [doc]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_DOC:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}
  agent-documentaliste:
    <<: *agent
    entrypoint: [documentaliste]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_DOCUMENTALISTE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-pm:
    <<: *agent
    entrypoint: [pm]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_PM:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-tri:
    <<: *agent
    entrypoint: [tri]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_TRI:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-entreprise:
    <<: *agent
    entrypoint: [archi-entreprise]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_ENTREPRISE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-affaires:
    <<: *agent
    entrypoint: [archi-affaires]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_AFFAIRES:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-donnees:
    <<: *agent
    entrypoint: [archi-donnees]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_DONNEES:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-applicatif:
    <<: *agent
    entrypoint: [archi-applicatif]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_APPLICATIF:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-techno:
    <<: *agent
    entrypoint: [archi-techno]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_TECHNO:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-securite:
    <<: *agent
    entrypoint: [archi-securite]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_SECURITE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-solution:
    <<: *agent
    entrypoint: [archi-solution]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_SOLUTION:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

  agent-archi-entreprise-synthese:
    <<: *agent
    entrypoint: [archi-entreprise-synthese]
    environment:
      AGENT_SECRET: ${PORTAIL_AGENT_SECRET_ARCHI_ENTREPRISE_SYNTHESE:?}
      AGENT_PORTAIL_URL: http://portail:8000
      AGENT_VERSION: ${IMAGE_TAG:-latest}

volumes:
  # ponytail: l'ancien volume portail-donnees reste orphelin, à supprimer à la main
  portail-donnees-2:
  # Nom fixe : le lanceur le désigne par ce nom.
  portail-espaces:
    name: portail-espaces

networks:
  infra-net:
    external: true
  portail-lanceur:
    internal: true
  # Portail et agents seulement : ni Infra, ni base, ni LiteLLM, ni lanceur, ni Internet.
  # Sous-réseau fixe, réservé, hors des plages que Docker attribue seul (172.17-31, 192.168) :
  # le portail n'accepte /api/ et /metrics d'aucun pair de cette plage.
  portail-agents:
    internal: true
    ipam:
      config:
        - subnet: 10.250.250.0/24
